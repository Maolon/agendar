[workspace]
resolver = "3"
members = ["crates/agendar-core", "crates/agendar-cli", "crates/agendar-notify", "crates/agendar-chrome", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/Maolon/agendar"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
ulid = { version = "=3.0.0", features = ["serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
url = "=2.5.8"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
fs2 = "=0.4.3"
directories = "=6.0.0"
tempfile = "=3.27.0"
libc = "=0.2.191"
same-file = "=1.0.6"
proptest = "=1.12.0"
notify = "=8.2.1"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-build = "=2.7.4"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
