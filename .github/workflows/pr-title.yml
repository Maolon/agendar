name: pr title

# Pull requests are squash-merged and the PR title becomes the commit on main,
# which release-please reads to pick the next version: fix and perf bump the
# patch, feat the minor, a breaking change the major (the minor below 1.0).

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: pr title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
