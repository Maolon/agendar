name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - name: One version everywhere
        run: node scripts/check-version.mjs

  seed-oracles:
    name: seed oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen seed bytes
        run: python3 crates/agendar-core/tests/oracle/tools/materialize_seeds.py --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Show toolchain
        run: rustup show
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false
      - name: Install frontend packages
        run: pnpm -C app install --frozen-lockfile
      - name: Install Tauri Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libssl-dev
      - name: Stage bundled CLI sidecar
        run: pnpm -C app run bundle:cli
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Frontend typecheck
        run: pnpm -C app typecheck
      - name: Frontend tests
        run: pnpm -C app test
      - name: Native build check
        run: pnpm -C app run check:tauri
